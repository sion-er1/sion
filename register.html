<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Регистрация</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
  header{background:#2c3e50;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff;text-decoration:none;margin-left:16px}
  main{max-width:1000px;margin:24px auto;padding:0 16px}
  h1{color:#2c3e50}
  .card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);max-width:420px;margin:0 auto}
  input{width:100%;padding:8px 10px;font-size:14px;border:1px solid #ccc;border-radius:6px}
  button{width:100%;padding:10px;background:#2c3e50;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
  button:hover{background:#1a252f}
  .flash{padding:10px;border-radius:6px;margin-bottom:12px;display:none}
  .flash.error{background:#f8d7da;color:#721c24;display:block}
  .flash.success{background:#d4edda;color:#155724;display:block}
</style>
</head>
<body>
<header>
  <strong>📚 Онлайн-библиотека</strong>
  <nav id="nav"></nav>
</header>
<main>
  <div class="card">
    <h1>Регистрация читателя</h1>
    <div id="msg" class="flash"></div>
    <form id="form">
      <p><input id="email" type="email" placeholder="Email" required></p>
      <p><input id="password" type="password" placeholder="Пароль (мин. 6 символов)" required></p>
      <p><button type="submit">Зарегистрироваться</button></p>
    </form>
    <p style="text-align:center">Уже есть аккаунт? <a href="login.html">Войти</a></p>
  </div>
</main>

<script>
function currentUser(){return JSON.parse(localStorage.getItem('currentUser')||'null')}
function renderHeader(){
  const u = currentUser();
  document.getElementById('nav').innerHTML = `
    <a href="index.html">Каталог</a>
    ${u
      ? `<a href="admin.html">Панель</a><a href="#" onclick="logout();return false">Выйти (${u.email})</a>`
      : `<a href="register.html">Регистрация</a><a href="login.html">Вход</a>`}
  `;
}
function logout(){localStorage.removeItem('currentUser');location.href='index.html'}

document.addEventListener('DOMContentLoaded', ()=>{
  if(!localStorage.getItem('users')){
    localStorage.setItem('users', JSON.stringify([
      {id:1,email:'admin@lib.ru',password:'admin123',role:'admin'}
    ]));
  }
  renderHeader();

  document.getElementById('form').addEventListener('submit', e=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    const msg   = document.getElementById('msg');

    const show = (t,cls)=>{msg.className='flash '+cls; msg.textContent=t;};

    if(!email.includes('@')) return show('Некорректный email','error');
    if(pass.length<6) return show('Пароль должен быть не короче 6 символов','error');

    const users = JSON.parse(localStorage.getItem('users')||'[]');
    if(users.find(u=>u.email===email)) return show('Пользователь уже существует','error');

    const id = users.length ? Math.max(...users.map(u=>u.id))+1 : 1;
    users.push({id,email,password:pass,role:'reader'});
    localStorage.setItem('users', JSON.stringify(users));

    show('Регистрация успешна! Переход ко входу…','success');
    setTimeout(()=>location.href='login.html', 1000);
  });
});
</script>
</body>
</html>
